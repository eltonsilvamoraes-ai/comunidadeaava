<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Área do Voluntário</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" role="main">

    <header class="brand">
      <h1 class="brand__nome">Área do Voluntário</h1>
      <p class="brand__sub">Registre presença e veja suas escalas</p>
    </header>

    <!-- Entrada: matrícula -->
    <section id="v-entrada" class="screen is-active">
      <label class="label" for="v-cod">Sua matrícula</label>
      <input id="v-cod" class="input" type="text" inputmode="numeric" autocomplete="off"
             style="text-align:center; letter-spacing:2px; font-size:20px" />
      <button id="v-presenca" class="btn" type="button">Registrar presença</button>
      <button id="v-escalas" class="btn btn--ghost" type="button">Ver minhas escalas</button>
      <p id="v-msg" class="msg" role="alert"></p>
    </section>

    <!-- Presença confirmada -->
    <section id="v-ok" class="screen">
      <h2 class="titulo">Presença registrada! ✅</h2>
      <p id="v-ok-nome" class="destaque"></p>
      <p id="v-ok-escala" class="muted"></p>
      <p id="v-ok-rec" class="msg ok"></p>
      <a class="voltar" id="v-volta-1">‹ Voltar</a>
    </section>

    <!-- Minhas escalas -->
    <section id="v-lista" class="screen screen--left">
      <h2 class="titulo">Minhas escalas</h2>
      <p id="v-saud" class="muted"></p>
      <div id="v-escalas-conteudo"></div>
      <a class="voltar" id="v-volta-2">‹ Voltar</a>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="voluntario.js"></script>
</body>
</html>
