<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <title>AAVA — Voluntários</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="card" role="main">

    <header class="brand">
      <img src="assets/logo.svg" alt="AAVA — Um lugar de recomeço" class="brand__logo" />
    </header>

    <!-- TELA: Início = Registrar Presença + menu -->
    <section id="tela-inicio" class="screen is-active">
      <label for="campo-codigo" class="label">INSIRA SEU CÓDIGO</label>
      <input id="campo-codigo" class="input" type="text" inputmode="numeric" autocomplete="off" />
      <p id="msg-erro" class="erro" role="alert"></p>
      <button id="btn-confirmar" class="btn" type="button">Confirmar</button>

      <nav class="menu">
        <a class="menu-link" data-ir="tela-pin">
          <span>ÁREA DO LÍDER</span><span class="menu-seta">›</span>
        </a>
        <a class="menu-link" data-ir="tela-minhas">
          <span>CONSULTE SUA ESCALA</span><span class="menu-seta">›</span>
        </a>
      </nav>

      <p id="aviso-demo" class="aviso-demo" hidden>Modo demonstração — não está gravando na planilha.</p>
    </section>

    <!-- TELA: Confirmação -->
    <section id="tela-ok" class="screen screen--ok">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="none"/><path fill="none" d="M14 27 l8 8 l16 -18"/></svg>
      </div>
      <h1 id="ok-titulo" class="ok__titulo">Presença registrada!</h1>
      <p id="ok-nome" class="ok__nome"></p>
      <p id="ok-detalhe" class="ok__detalhe"></p>
      <p id="ok-escala" class="ok__escala"></p>
      <button id="btn-novo" class="btn btn--ghost" type="button">Registrar outro</button>
    </section>

    <!-- TELA: PIN da Área do Líder -->
    <section id="tela-pin" class="screen">
      <label for="campo-pin" class="label">PIN DO LÍDER</label>
      <input id="campo-pin" class="input" type="password" inputmode="numeric" autocomplete="off" />
      <p id="pin-erro" class="erro" role="alert"></p>
      <button id="btn-pin" class="btn" type="button">Entrar</button>
      <a class="voltar" data-ir="tela-inicio">‹ Início</a>
    </section>

    <!-- TELA: Menu do Líder -->
    <section id="tela-menu" class="screen">
      <h2 class="titulo">Área do Líder</h2>
      <button class="menu-btn menu-btn--primary" data-ir="tela-escala">Montar Escala</button>
      <button class="menu-btn menu-btn--ghost" disabled>Relatórios (em breve)</button>
      <a class="voltar" data-ir="tela-inicio">‹ Sair</a>
    </section>

    <!-- TELA: Montar Escala -->
    <section id="tela-escala" class="screen screen--form">
      <h2 class="titulo">Montar Escala</h2>

      <label class="campo-label" for="esc-departamento">Departamento</label>
      <select id="esc-departamento" class="campo"></select>

      <div class="form-row">
        <div class="form-col">
          <label class="campo-label" for="esc-data">Data do culto</label>
          <input id="esc-data" class="campo" type="date" />
        </div>
        <div class="form-col">
          <label class="campo-label" for="esc-horario">Horário</label>
          <input id="esc-horario" class="campo" type="time" />
        </div>
      </div>

      <p class="campo-label">Voluntários escalados</p>
      <div id="esc-lista" class="lista"><p class="lista-vazia">Selecione um departamento.</p></div>

      <p id="esc-msg" class="erro" role="alert"></p>
      <button id="btn-salvar-escala" class="btn" type="button">Salvar escala</button>
      <a class="voltar" data-ir="tela-menu">‹ Voltar</a>
    </section>

    <!-- TELA: Minhas Escalas -->
    <section id="tela-minhas" class="screen">
      <h2 class="titulo">Minhas Escalas</h2>
      <label for="campo-minhas" class="label">INSIRA SEU CÓDIGO</label>
      <input id="campo-minhas" class="input" type="text" inputmode="numeric" autocomplete="off" />
      <p id="minhas-erro" class="erro" role="alert"></p>
      <button id="btn-minhas" class="btn" type="button">Ver escalas</button>
      <p id="minhas-nome" class="minhas-nome"></p>
      <div id="minhas-lista"></div>
      <a class="voltar" data-ir="tela-inicio">‹ Início</a>
    </section>

  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
